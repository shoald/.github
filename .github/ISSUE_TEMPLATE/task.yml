name: Task
description: Work that isn't a bug or a feature, like setup, refactoring, or docs.
labels: ["chore"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: What will be true once this is finished?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - player
        - edge
        - cloud
        - cms
        - docs
        - not sure
