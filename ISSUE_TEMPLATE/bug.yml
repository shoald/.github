name: Bug report
description: Something isn't working.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pair a device with the venue.
        2. Restart the edge node.
        3. The screen goes blank.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Screens stop playing
        - Something works wrong
        - Cosmetic
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - player
        - edge
        - cloud
        - panel
        - not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, OS, and version, if relevant.
      placeholder: Pi 4, Linux, player v0.2.1
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs. Remove secrets first.
      render: text
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag and drop files here. For screen problems, a short video helps most.
